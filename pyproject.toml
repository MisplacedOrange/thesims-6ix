[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesims-6ix"
version = "0.2.0"
description = "Exploratory Toronto food-policy simulation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["sim*"]
namespaces = true

[tool.setuptools.package-data]
"sim.core" = ["data/*.json"]
"sim.district" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["sim"]
addopts = "--import-mode=importlib"
pythonpath = [".", "sim/core/tests"]
